<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white pb-20 sm:pb-0 transition-colors duration-200">

  <!-- APLICAÇÃO REACT -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // --- CONFIGURAÇÃO MANUAL DO GOOGLE SHEETS ---
    // Cole aqui o seu URL do Apps Script entre as aspas para que todos os dispositivos o carreguem automaticamente.
    const URL_PREDEFINIDO_SHEETS = "https://script.google.com/macros/s/AKfycbyiFl6DwH-3zY4UFlE1Reqi0UJ3smr5DqxP4ZXcCXyRdzW1AETFBCWIF5_X1hiKZvKoYw/exec";

    // --- HELPER DE NORMALIZAÇÃO DE DATAS E HORAS ---
    const normalizeDateStr = (dateStr) => {
      if (!dateStr) return '';
      let str = String(dateStr).trim();
      
      // Se já está no formato YYYY-MM-DD
      if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
        return str;
      }
      
      // Se for formato ISO string (ex: "2026-11-05T00:00:00.000Z")
      if (str.includes('T')) {
        str = str.split('T')[0];
        if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
      }

      // Se for formato DD/MM/YYYY (pt-PT)
      const ddmmyyyyMatch = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (ddmmyyyyMatch) {
        const day = ddmmyyyyMatch[1].padStart(2, '0');
        const month = ddmmyyyyMatch[2].padStart(2, '0');
        const year = ddmmyyyyMatch[3];
        return `${year}-${month}-${day}`;
      }

      // Tentar conversão via objeto Date
      const parsed = new Date(str);
      if (!isNaN(parsed.getTime())) {
        const year = parsed.getFullYear();
        const month = String(parsed.getMonth() + 1).padStart(2, '0');
        const day = String(parsed.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      return str;
    };

    const normalizeTimeStr = (timeStr, defaultTime = '09:00') => {
      if (!timeStr) return defaultTime;
      let str = String(timeStr).trim();

      const match = str.match(/(\d{1,2}):(\d{2})/);
      if (match) {
        const h = match[1].padStart(2, '0');
        const m = match[2];
        return `${h}:${m}`;
      }

      return defaultTime;
    };

    const parseHourNumber = (timeStr) => {
      const norm = normalizeTimeStr(timeStr, '09:00');
      const h = parseInt(norm.split(':')[0], 10);
      return isNaN(h) ? 9 : h;
    };

    const formatDateKey = (date) => {
      const d = new Date(date);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    // --- ÍCONES SVG ---
    const IconCalendar = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>;
    const IconChevronLeft = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg>;
    const IconChevronRight = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>;
    const IconPlus = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>;
    const IconMapPin = () => <svg className="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>;
    const IconClock = () => <svg className="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>;
    const IconTrash = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>;
    const IconEdit = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>;
    const IconGrid = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>;
    const IconDays = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>;
    const IconSearch = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>;
    const IconFilter = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>;
    const IconSheets = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>;
    const IconCheck = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>;
    const IconX = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>;
    const IconSwipeHand = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 11.5V14m0 0v-2.5m0 2.5l-3-3m8 8h5a2 2 0 002-2V9a2 2 0 00-2-2h-3m-4 4V4a2 2 0 00-4 0v7.5"></path></svg>;
    const IconSun = () => <svg className="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>;
    const IconMoon = () => <svg className="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>;
    const IconTag = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 7h.01M7 3h5a1 1 0 01.707.293l7 7a1 1 0 010 1.414l-7 7a1 1 0 01-1.414 0l-7-7A1 1 0 013 12V7a4 4 0 014-4z"></path></svg>;
    const IconRefresh = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>;
    const IconPrinter = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>;

    // --- CONFIGURAÇÃO DE CATEGORIAS E CORES ---
    const COLOR_OPTIONS = [
      { id: 'indigo', label: 'Índigo', bg: 'bg-indigo-500/15 dark:bg-indigo-500/20', text: 'text-indigo-700 dark:text-indigo-300', border: 'border-indigo-500/30', dot: 'bg-indigo-500' },
      { id: 'emerald', label: 'Esmeralda', bg: 'bg-emerald-500/15 dark:bg-emerald-500/20', text: 'text-emerald-700 dark:text-emerald-300', border: 'border-emerald-500/30', dot: 'bg-emerald-500' },
      { id: 'rose', label: 'Rosa / Vermelho', bg: 'bg-rose-500/15 dark:bg-rose-500/20', text: 'text-rose-700 dark:text-rose-300', border: 'border-rose-500/30', dot: 'bg-rose-500' },
      { id: 'violet', label: 'Violeta / Roxo', bg: 'bg-violet-500/15 dark:bg-violet-500/20', text: 'text-violet-700 dark:text-violet-300', border: 'border-violet-500/30', dot: 'bg-violet-500' },
      { id: 'amber', label: 'Âmbar / Amarelo', bg: 'bg-amber-500/15 dark:bg-amber-500/20', text: 'text-amber-700 dark:text-amber-300', border: 'border-amber-500/30', dot: 'bg-amber-500' },
      { id: 'cyan', label: 'Ciano', bg: 'bg-cyan-500/15 dark:bg-cyan-500/20', text: 'text-cyan-700 dark:text-cyan-300', border: 'border-cyan-500/30', dot: 'bg-cyan-500' },
      { id: 'pink', label: 'Pink', bg: 'bg-pink-500/15 dark:bg-pink-500/20', text: 'text-pink-700 dark:text-pink-300', border: 'border-pink-500/30', dot: 'bg-pink-500' },
      { id: 'orange', label: 'Laranja', bg: 'bg-orange-500/15 dark:bg-orange-500/20', text: 'text-orange-700 dark:text-orange-300', border: 'border-orange-500/30', dot: 'bg-orange-500' },
      { id: 'teal', label: 'Verde-Água', bg: 'bg-teal-500/15 dark:bg-teal-500/20', text: 'text-teal-700 dark:text-teal-300', border: 'border-teal-500/30', dot: 'bg-teal-500' },
      { id: 'sky', label: 'Céu (Azul)', bg: 'bg-sky-500/15 dark:bg-sky-500/20', text: 'text-sky-700 dark:text-sky-300', border: 'border-sky-500/30', dot: 'bg-sky-500' },
    ];

    const DEFAULT_CATEGORIES = [
      { id: 'work', label: 'Trabalho', color: 'indigo' },
      { id: 'personal', label: 'Pessoal', color: 'emerald' },
      { id: 'health', label: 'Saúde', color: 'rose' },
      { id: 'study', label: 'Estudo', color: 'violet' },
      { id: 'finance', label: 'Finanças', color: 'amber' },
      { id: 'social', label: 'Lazer & Social', color: 'cyan' },
    ];

    const INITIAL_EVENTS = [];

    // --- COMPONENTE PRINCIPAL ---
    function App() {
      const [events, setEvents] = useState(() => {
        const saved = localStorage.getItem('agenda_events_v3');
        if (!saved) return INITIAL_EVENTS;
        try {
          const parsed = JSON.parse(saved);
          return parsed.map(evt => ({
            ...evt,
            date: normalizeDateStr(evt.date),
            startTime: normalizeTimeStr(evt.startTime, '09:00'),
            endTime: normalizeTimeStr(evt.endTime, '10:00')
          }));
        } catch(e) {
          return INITIAL_EVENTS;
        }
      });

      const [categories, setCategories] = useState(() => {
        const saved = localStorage.getItem('agenda_categories_v3');
        return saved ? JSON.parse(saved) : DEFAULT_CATEGORIES;
      });

      const [theme, setTheme] = useState(() => {
        return localStorage.getItem('agenda_theme') || 'dark';
      });

      const [currentDate, setCurrentDate] = useState(new Date());
      const [viewMode, setViewMode] = useState('month');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategoryFilter, setSelectedCategoryFilter] = useState('all');

      // Modais
      const [isEventModalOpen, setIsEventModalOpen] = useState(false);
      const [editingEvent, setEditingEvent] = useState(null);
      const [isSyncModalOpen, setIsSyncModalOpen] = useState(false);
      const [isCategoryModalOpen, setIsCategoryModalOpen] = useState(false);
      const [eventToDeleteId, setEventToDeleteId] = useState(null);

      // Google Sheets
      const [sheetUrl, setSheetUrl] = useState(() => {
        if (URL_PREDEFINIDO_SHEETS && URL_PREDEFINIDO_SHEETS.startsWith('https://')) {
          return URL_PREDEFINIDO_SHEETS;
        }
        return localStorage.getItem('agenda_sheet_url') || '';
      });
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncStatus, setSyncStatus] = useState({ type: null, message: '' });

      // Gestão do Tema (Modo Claro / Escuro)
      useEffect(() => {
        localStorage.setItem('agenda_theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));
      };

      // Formulário do Evento
      const [formData, setFormData] = useState({
        title: '',
        date: formatDateKey(new Date()),
        startTime: '09:00',
        endTime: '10:00',
        location: '',
        category: 'work',
        notes: ''
      });

      // Controlo de gestos Swipe
      const touchStartX = useRef(null);
      const touchStartY = useRef(null);
      const touchEndX = useRef(null);
      const touchEndY = useRef(null);

      const getCategoryMeta = (catId) => {
        const found = categories.find(c => c.id === catId);
        const colorId = found ? found.color : 'indigo';
        const colorMeta = COLOR_OPTIONS.find(c => c.id === colorId) || COLOR_OPTIONS[0];
        return {
          id: catId,
          label: found ? found.label : catId,
          ...colorMeta
        };
      };

      useEffect(() => {
        localStorage.setItem('agenda_events_v3', JSON.stringify(events));
      }, [events]);

      useEffect(() => {
        localStorage.setItem('agenda_categories_v3', JSON.stringify(categories));
      }, [categories]);

      useEffect(() => {
        localStorage.setItem('agenda_sheet_url', sheetUrl);
      }, [sheetUrl]);

      // --- SINCRONIZAÇÃO AUTOMÁTICA (PULL - LEITURA DA NUVEM VIA GET) ---
      const fetchFromSheets = useCallback(async (silent = false) => {
        const currentUrl = localStorage.getItem('agenda_sheet_url') || sheetUrl;
        if (!currentUrl || !currentUrl.trim()) return;

        if (!silent) {
          setIsSyncing(true);
          setSyncStatus({ type: 'info', message: 'A carregar dados do Google Sheets...' });
        }

        try {
          const response = await fetch(currentUrl.trim(), { method: 'GET' });
          const resData = await response.json();

          if (resData && resData.status === 'success') {
            if (Array.isArray(resData.events)) {
              const formattedEvents = resData.events.map(evt => ({
                ...evt,
                date: normalizeDateStr(evt.date),
                startTime: normalizeTimeStr(evt.startTime, '09:00'),
                endTime: normalizeTimeStr(evt.endTime, '10:00')
              }));

              setEvents(formattedEvents);
              localStorage.setItem('agenda_events_v3', JSON.stringify(formattedEvents));
            }
            if (Array.isArray(resData.categories) && resData.categories.length > 0) {
              setCategories(resData.categories);
              localStorage.setItem('agenda_categories_v3', JSON.stringify(resData.categories));
            }
            if (!silent) {
              setSyncStatus({ type: 'success', message: 'Dados sincronizados com sucesso!' });
            }
          }
        } catch (err) {
          console.error("Erro na leitura da Google Sheets:", err);
          if (!silent) {
            setSyncStatus({ type: 'error', message: 'Erro ao carregar dados do Google Sheets.' });
          }
        } finally {
          if (!silent) setIsSyncing(false);
        }
      }, [sheetUrl]);

      // --- SINCRONIZAÇÃO AUTOMÁTICA (PUSH - ESCRITA NA NUVEM VIA POST) ---
      const pushToSheets = async (targetEvents = events, targetCategories = categories) => {
        const currentUrl = localStorage.getItem('agenda_sheet_url') || sheetUrl;
        if (!currentUrl || !currentUrl.trim()) return;

        setIsSyncing(true);
        setSyncStatus({ type: 'info', message: 'A guardar alterações na nuvem...' });

        try {
          const response = await fetch(currentUrl.trim(), {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ events: targetEvents, categories: targetCategories }),
          });

          const resData = await response.json();

          if (resData.status === 'success') {
            setSyncStatus({ type: 'success', message: 'Alterações guardadas no Google Sheets!' });
          } else {
            throw new Error(resData.message || 'Erro ao guardar dados.');
          }
        } catch (err) {
          console.error("Erro no envio para Google Sheets:", err);
          setSyncStatus({ type: 'error', message: 'Erro de conexão ao Google Sheets.' });
        } finally {
          setIsSyncing(false);
        }
      };

      // Auto-sync ao abrir a aplicação no dispositivo
      useEffect(() => {
        if (sheetUrl && sheetUrl.trim()) {
          fetchFromSheets(true);
        }
      }, []);

      // Auto-sync ao focar na janela / mudar de separador
      useEffect(() => {
        const handleFocus = () => {
          if (document.visibilityState === 'visible' && sheetUrl && sheetUrl.trim()) {
            fetchFromSheets(true);
          }
        };

        window.addEventListener('focus', handleFocus);
        document.addEventListener('visibilitychange', handleFocus);
        return () => {
          window.removeEventListener('focus', handleFocus);
          document.removeEventListener('visibilitychange', handleFocus);
        };
      }, [fetchFromSheets, sheetUrl]);

      // Polling de sincronização automática a cada 15 segundos
      useEffect(() => {
        if (!sheetUrl || !sheetUrl.trim()) return;
        const interval = setInterval(() => {
          fetchFromSheets(true);
        }, 15000);
        return () => clearInterval(interval);
      }, [fetchFromSheets, sheetUrl]);

      const filteredEvents = useMemo(() => {
        return events.filter(evt => {
          const matchesSearch = 
            (evt.title && evt.title.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (evt.location && evt.location.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (evt.notes && evt.notes.toLowerCase().includes(searchQuery.toLowerCase()));
          
          const matchesCategory = selectedCategoryFilter === 'all' || evt.category === selectedCategoryFilter;
          return matchesSearch && matchesCategory;
        });
      }, [events, searchQuery, selectedCategoryFilter]);

      const handleToday = () => setCurrentDate(new Date());

      const handlePrev = () => {
        const newDate = new Date(currentDate);
        if (viewMode === 'month') newDate.setMonth(newDate.getMonth() - 1);
        else if (viewMode === 'week') newDate.setDate(newDate.getDate() - 7);
        else if (viewMode === 'day') newDate.setDate(newDate.getDate() - 1);
        setCurrentDate(newDate);
      };

      const handleNext = () => {
        const newDate = new Date(currentDate);
        if (viewMode === 'month') newDate.setMonth(newDate.getMonth() + 1);
        else if (viewMode === 'week') newDate.setDate(newDate.getDate() + 7);
        else if (viewMode === 'day') newDate.setDate(newDate.getDate() + 1);
        setCurrentDate(newDate);
      };

      // Gestos Swipe
      const handleTouchStart = (e) => {
        touchStartX.current = e.targetTouches[0].clientX;
        touchStartY.current = e.targetTouches[0].clientY;
      };

      const handleTouchMove = (e) => {
        touchEndX.current = e.targetTouches[0].clientX;
        touchEndY.current = e.targetTouches[0].clientY;
      };

      const handleTouchEnd = () => {
        if (!touchStartX.current || !touchEndX.current) return;

        const distanceX = touchStartX.current - touchEndX.current;
        const distanceY = Math.abs((touchStartY.current || 0) - (touchEndY.current || 0));

        if (Math.abs(distanceX) > distanceY && Math.abs(distanceX) > 50) {
          if (distanceX > 0) {
            handleNext();
          } else {
            handlePrev();
          }
        }

        touchStartX.current = null;
        touchStartY.current = null;
        touchEndX.current = null;
        touchEndY.current = null;
      };

      const openNewEventModal = (dateStr = formatDateKey(currentDate), timeStr = '09:00') => {
        const startNorm = normalizeTimeStr(timeStr, '09:00');
        const startH = parseHourNumber(startNorm);
        const endH = (startH + 1) % 24;
        const endStr = `${String(endH).padStart(2, '0')}:${startNorm.split(':')[1] || '00'}`;

        setEditingEvent(null);
        setFormData({
          title: '',
          date: normalizeDateStr(dateStr),
          startTime: startNorm,
          endTime: endStr,
          location: '',
          category: categories[0]?.id || 'work',
          notes: ''
        });
        setIsEventModalOpen(true);
      };

      const openEditEventModal = (eventObj, e) => {
        if (e) e.stopPropagation();
        setEditingEvent(eventObj);
        setFormData({
          ...eventObj,
          date: normalizeDateStr(eventObj.date),
          startTime: normalizeTimeStr(eventObj.startTime, '09:00'),
          endTime: normalizeTimeStr(eventObj.endTime, '10:00')
        });
        setIsEventModalOpen(true);
      };

      const handleSaveEvent = (e) => {
        e.preventDefault();
        if (!formData.title.trim()) return;

        const normalizedForm = {
          ...formData,
          date: normalizeDateStr(formData.date),
          startTime: normalizeTimeStr(formData.startTime, '09:00'),
          endTime: normalizeTimeStr(formData.endTime, '10:00')
        };

        let updatedEvents;
        if (editingEvent) {
          updatedEvents = events.map(evt => evt.id === editingEvent.id ? { ...normalizedForm, id: editingEvent.id } : evt);
        } else {
          const newEvt = { ...normalizedForm, id: Date.now().toString() };
          updatedEvents = [...events, newEvt];
        }

        setEvents(updatedEvents);
        setIsEventModalOpen(false);

        if (sheetUrl.trim()) {
          pushToSheets(updatedEvents, categories);
        }
      };

      const handleAddCategory = (newCat) => {
        const updatedCats = [...categories, newCat];
        setCategories(updatedCats);
        setFormData(prev => ({ ...prev, category: newCat.id }));
        setIsCategoryModalOpen(false);

        if (sheetUrl.trim()) {
          pushToSheets(events, updatedCats);
        }
      };

      const promptDeleteEvent = (id, e) => {
        if (e) e.stopPropagation();
        setEventToDeleteId(id);
      };

      const confirmDeleteEvent = () => {
        if (!eventToDeleteId) return;
        const updatedEvents = events.filter(evt => evt.id !== eventToDeleteId);
        setEvents(updatedEvents);
        setEventToDeleteId(null);
        setIsEventModalOpen(false);

        if (sheetUrl.trim()) {
          pushToSheets(updatedEvents, categories);
        }
      };

      const handleSyncGoogleSheets = async () => {
        if (!sheetUrl.trim()) {
          setSyncStatus({ type: 'error', message: 'Insira o URL do Apps Script do Google.' });
          return;
        }
        await fetchFromSheets(false);
      };

      // FORMATADOR DA BARRA DE NAVEGAÇÃO DE DATAS (pt-PT)
      const headerDateLabel = useMemo(() => {
        const locale = 'pt-PT';
        if (viewMode === 'month') {
          const monthStr = currentDate.toLocaleDateString(locale, { month: 'long' });
          const capitalizedMonth = monthStr.charAt(0).toUpperCase() + monthStr.slice(1);
          return `${capitalizedMonth} ${currentDate.getFullYear()}`;
        } else if (viewMode === 'day') {
          const weekdayRaw = currentDate.toLocaleDateString(locale, { weekday: 'long' });
          const weekday = weekdayRaw.split('-')[0];
          const capitalizedWeekday = weekday.charAt(0).toUpperCase() + weekday.slice(1);
          const monthStr = currentDate.toLocaleDateString(locale, { month: 'long' });
          const capitalizedMonth = monthStr.charAt(0).toUpperCase() + monthStr.slice(1);
          return `${capitalizedWeekday}, ${currentDate.getDate()} ${capitalizedMonth} ${currentDate.getFullYear()}`;
        } else {
          const dayOfWeek = (currentDate.getDay() + 6) % 7;
          const startOfWeek = new Date(currentDate);
          startOfWeek.setDate(currentDate.getDate() - dayOfWeek);
          const endOfWeek = new Date(startOfWeek);
          endOfWeek.setDate(startOfWeek.getDate() + 6);

          const formatShortMonth = (d) => {
            let m = d.toLocaleDateString(locale, { month: 'short' }).replace('.', '');
            return m.charAt(0).toUpperCase() + m.slice(1) + '.';
          };

          const startDay = startOfWeek.getDate();
          const startMonth = formatShortMonth(startOfWeek);
          const endDay = endOfWeek.getDate();
          const endMonth = formatShortMonth(endOfWeek);
          const endYear = endOfWeek.getFullYear();

          return `${startDay} ${startMonth} - ${endDay} ${endMonth} ${endYear}`;
        }
      }, [currentDate, viewMode]);

      return (
        <div className="flex flex-col min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-200">
          {/* CABEÇALHO SUPERIOR */}
          <header className="sticky top-0 z-30 backdrop-blur-xl bg-white/90 dark:bg-slate-900/90 border-b border-slate-200 dark:border-slate-800/80 px-3 sm:px-8 py-3 flex items-center justify-between gap-2 shadow-sm dark:shadow-xl">
            <div className="flex items-center gap-2 sm:gap-3">
              <div className="p-2 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-xl shadow-lg shadow-indigo-500/20 text-white shrink-0">
                <IconCalendar />
              </div>
              <div>
                <h1 className="text-base sm:text-xl font-bold bg-gradient-to-r from-slate-900 via-slate-700 to-slate-500 dark:from-white dark:via-slate-200 dark:to-slate-400 bg-clip-text text-transparent leading-tight">
                  Agenda Pessoal Francisco
                </h1>
                <p className="text-[10px] sm:text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1">
                  <span className={`w-1.5 h-1.5 rounded-full ${isSyncing ? 'bg-amber-500 animate-ping' : sheetUrl ? 'bg-emerald-500 animate-pulse' : 'bg-slate-400'}`}></span>
                  {isSyncing ? 'A sincronizar...' : sheetUrl ? 'Auto-sync Google Sheets Ativo' : 'Apenas Local'}
                </p>
              </div>
            </div>

            {/* SELETOR DE MODO (MÊS, SEMANA, DIA) */}
            <div className="hidden md:flex items-center gap-1 bg-slate-200/80 dark:bg-slate-800/70 p-1 rounded-xl border border-slate-300 dark:border-slate-700/60">
              <button
                onClick={() => setViewMode('month')}
                className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all flex items-center gap-1.5 ${
                  viewMode === 'month' 
                    ? 'bg-indigo-600 text-white shadow-md shadow-indigo-500/20' 
                    : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                }`}
              >
                <IconGrid />
                Mês
              </button>
              <button
                onClick={() => setViewMode('week')}
                className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all flex items-center gap-1.5 ${
                  viewMode === 'week' 
                    ? 'bg-indigo-600 text-white shadow-md shadow-indigo-500/20' 
                    : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                }`}
              >
                <IconDays />
                Semana
              </button>
              <button
                onClick={() => setViewMode('day')}
                className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all flex items-center gap-1.5 ${
                  viewMode === 'day' 
                    ? 'bg-indigo-600 text-white shadow-md shadow-indigo-500/20' 
                    : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                }`}
              >
                <IconClock />
                Dia
              </button>
            </div>

            {/* AÇÕES (TEMA, SHEETS, NOVO EVENTO) */}
            <div className="flex items-center gap-1.5 sm:gap-2">
              <button
                onClick={toggleTheme}
                className="p-2.5 rounded-xl border border-slate-300 dark:border-slate-700/80 bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition-all shadow-sm"
                title={theme === 'dark' ? 'Mudar para Modo Claro' : 'Mudar para Modo Escuro'}
              >
                {theme === 'dark' ? <IconSun /> : <IconMoon />}
              </button>

              <button
                onClick={() => setIsSyncModalOpen(true)}
                className="px-2.5 sm:px-3 py-2 text-xs font-medium rounded-xl border border-emerald-500/40 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-500/20 transition-all flex items-center gap-1.5 shadow-sm"
                title="Conectar com Google Sheets / Drive"
              >
                <IconSheets />
                <span className="hidden sm:inline">Google Sheets</span>
              </button>

              <button
                onClick={() => openNewEventModal()}
                className="px-3 py-2 text-xs font-semibold rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white shadow-md shadow-indigo-500/20 active:scale-95 transition-all flex items-center gap-1"
              >
                <IconPlus />
                <span className="hidden sm:inline">Novo Compromisso</span>
              </button>
            </div>
          </header>

          {/* BARRA DE SELEÇÃO RÁPIDA DE VISTA PARA MOBILE */}
          <div className="md:hidden bg-slate-200/90 dark:bg-slate-900/90 border-b border-slate-300 dark:border-slate-800 p-1.5 flex justify-around">
            <button
              onClick={() => setViewMode('month')}
              className={`flex-1 py-1.5 text-xs font-semibold rounded-lg text-center transition-all ${
                viewMode === 'month' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 dark:text-slate-400'
              }`}
            >
              Mês
            </button>
            <button
              onClick={() => setViewMode('week')}
              className={`flex-1 py-1.5 text-xs font-semibold rounded-lg text-center transition-all ${
                viewMode === 'week' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 dark:text-slate-400'
              }`}
            >
              Semana
            </button>
            <button
              onClick={() => setViewMode('day')}
              className={`flex-1 py-1.5 text-xs font-semibold rounded-lg text-center transition-all ${
                viewMode === 'day' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 dark:text-slate-400'
              }`}
            >
              Dia
            </button>
          </div>

          {/* SUB-BARRA DE NAVEGAÇÃO E FILTROS */}
          <div className="bg-slate-50 dark:bg-slate-900/40 border-b border-slate-200 dark:border-slate-800/60 px-3 sm:px-8 py-2.5 flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-2 sm:gap-3">
              <button
                onClick={handleToday}
                className="px-2.5 py-1.5 text-xs font-semibold rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all shadow-sm"
              >
                Hoje
              </button>

              <div className="flex items-center gap-0.5">
                <button
                  onClick={handlePrev}
                  className="p-1.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all"
                  aria-label="Anterior"
                >
                  <IconChevronLeft />
                </button>
                <button
                  onClick={handleNext}
                  className="p-1.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all"
                  aria-label="Próximo"
                >
                  <IconChevronRight />
                </button>
              </div>

              <h2 className="text-sm sm:text-lg font-bold text-slate-900 dark:text-slate-100">
                {headerDateLabel}
              </h2>
            </div>

            {/* FILTROS E PESQUISA */}
            <div className="flex items-center gap-2 w-full md:w-auto">
              <button
                onClick={() => window.print()}
                className="no-print px-3 py-1.5 text-xs font-semibold rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all flex items-center gap-1.5 shadow-sm"
                title="Imprimir calendário"
              >
                <IconPrinter />
                <span>Imprimir</span>
              </button>

              <div className="relative flex-1 md:w-56">
                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><IconSearch /></span>
                <input
                  type="text"
                  placeholder="Pesquisar..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full bg-white dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700/80 rounded-xl pl-9 pr-3 py-1.5 text-xs text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
                />
              </div>

              <div className="flex items-center gap-1.5 bg-white dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700/80 rounded-xl px-2.5 py-1.5">
                <span className="text-slate-400"><IconFilter /></span>
                <select
                  value={selectedCategoryFilter}
                  onChange={(e) => setSelectedCategoryFilter(e.target.value)}
                  className="bg-transparent text-xs text-slate-800 dark:text-slate-200 focus:outline-none cursor-pointer"
                >
                  <option value="all" className="bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200">Todas as Categorias</option>
                  {categories.map(cat => (
                    <option key={cat.id} value={cat.id} className="bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200">
                      {cat.label}
                    </option>
                  ))}
                </select>
              </div>
            </div>
          </div>

          {/* DICA VISUAL PARA MOBILE SWIPE */}
          <div className="sm:hidden bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 text-[10px] text-center py-1 flex items-center justify-center gap-1">
            <IconSwipeHand />
            <span>Deslize para a esquerda ou direita para mudar de data</span>
          </div>

          {/* CONTEÚDO PRINCIPAL (COM SUPORTE SWIPE) */}
          <main 
            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}
            onTouchEnd={handleTouchEnd}
            className="flex-1 p-3 sm:p-6 max-w-[1600px] w-full mx-auto overflow-x-auto touch-swipe-zone"
          >
            {/* CABEÇALHO EXCLUSIVO PARA IMPRESSÃO */}
            <div className="print-header flex-col pb-3 mb-4 border-b border-slate-300">
              <div className="flex justify-between items-center">
                <h1 className="text-xl font-bold text-slate-900">Agenda Pessoal Francisco</h1>
                <span className="text-sm font-semibold text-slate-700">{headerDateLabel}</span>
              </div>
              <p className="text-[10px] text-slate-500 mt-0.5">Relatório impresso em {new Date().toLocaleDateString('pt-PT')}</p>
            </div>

            {viewMode === 'month' && (
              <MonthView 
                currentDate={currentDate} 
                events={filteredEvents}
                getCategoryMeta={getCategoryMeta}
                onSelectDate={(d) => {
                  setCurrentDate(d);
                  setViewMode('day');
                }}
                onAddEventOnDate={(dateStr) => openNewEventModal(dateStr)}
                onEditEvent={openEditEventModal}
              />
            )}

            {viewMode === 'week' && (
              <WeekView 
                currentDate={currentDate} 
                events={filteredEvents}
                getCategoryMeta={getCategoryMeta}
                onAddEvent={(dateStr, timeStr) => openNewEventModal(dateStr, timeStr)}
                onEditEvent={openEditEventModal}
              />
            )}

            {viewMode === 'day' && (
              <DayView 
                currentDate={currentDate} 
                events={filteredEvents}
                getCategoryMeta={getCategoryMeta}
                onAddEvent={(dateStr, timeStr) => openNewEventModal(dateStr, timeStr)}
                onEditEvent={openEditEventModal}
                onDeleteEvent={promptDeleteEvent}
              />
            )}
          </main>

          {/* BOTÃO FLUTUANTE NO MOBILE (FAB) */}
          <button
            onClick={() => openNewEventModal()}
            className="sm:hidden fixed bottom-5 right-5 z-40 w-14 h-14 rounded-full bg-indigo-600 text-white shadow-xl flex items-center justify-center active:scale-95 transition-all"
            aria-label="Adicionar compromisso"
          >
            <IconPlus />
          </button>

          {/* MODAL: CRIAR / EDITAR EVENTO */}
          {isEventModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                <div className="px-5 py-3.5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-900/50">
                  <h3 className="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
                    {editingEvent ? <IconEdit /> : <IconPlus />}
                    {editingEvent ? 'Editar Compromisso' : 'Agendar Novo Compromisso'}
                  </h3>
                  <button 
                    onClick={() => setIsEventModalOpen(false)}
                    className="p-1 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-500 hover:text-slate-900 dark:hover:text-white transition-all"
                  >
                    <IconX />
                  </button>
                </div>

                <form onSubmit={handleSaveEvent} className="p-5 space-y-4 overflow-y-auto flex-1">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">
                      Título do Compromisso *
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="Ex: Reunião, Treino, Consulta..."
                      value={formData.title}
                      onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                      className="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">
                        Data *
                      </label>
                      <input
                        type="date"
                        required
                        value={formData.date}
                        onChange={(e) => setFormData({ ...formData, date: e.target.value })}
                        className="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 transition-all"
                      />
                    </div>

                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider">
                          Categoria
                        </label>
                        <button
                          type="button"
                          onClick={() => setIsCategoryModalOpen(true)}
                          className="text-[10px] text-indigo-600 dark:text-indigo-400 hover:underline font-semibold"
                        >
                          + Criar Nova
                        </button>
                      </div>
                      <select
                        value={formData.category}
                        onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                        className="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 transition-all cursor-pointer"
                      >
                        {categories.map(cat => (
                          <option key={cat.id} value={cat.id} className="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-200">
                            {cat.label}
                          </option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">
                        Hora Início
                      </label>
                      <input
                        type="time"
                        required
                        value={formData.startTime}
                        onChange={(e) => setFormData({ ...formData, startTime: e.target.value })}
                        className="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 transition-all"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">
                        Hora Fim
                      </label>
                      <input
                        type="time"
                        required
                        value={formData.endTime}
                        onChange={(e) => setFormData({ ...formData, endTime: e.target.value })}
                        className="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 transition-all"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">
                      Local do Evento
                    </label>

    // --- VISTA DO MÊS ---
    function MonthView({ currentDate, events, getCategoryMeta, onSelectDate, onAddEventOnDate, onEditEvent }) {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const calendarDays = useMemo(() => {
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        let startDayOfWeek = (firstDay.getDay() + 6) % 7;
        const totalDays = lastDay.getDate();

        const days = [];
        const prevMonthLastDay = new Date(year, month, 0).getDate();

        for (let i = startDayOfWeek - 1; i >= 0; i--) {
          const prevDate = new Date(year, month - 1, prevMonthLastDay - i);
          days.push({ date: prevDate, isCurrentMonth: false, dateKey: formatDateKey(prevDate) });
        }

        for (let i = 1; i <= totalDays; i++) {
          const currDate = new Date(year, month, i);
          days.push({ date: currDate, isCurrentMonth: true, dateKey: formatDateKey(currDate) });
        }

        const remaining = (7 - (days.length % 7)) % 7;
        for (let i = 1; i <= remaining; i++) {
          const nextDate = new Date(year, month + 1, i);
          days.push({ date: nextDate, isCurrentMonth: false, dateKey: formatDateKey(nextDate) });
        }

        return days;
      }, [year, month]);

      const weekDayLabels = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
      const todayKey = formatDateKey(new Date());

      return (
        <div className="bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm dark:shadow-xl flex flex-col">
          <div className="grid grid-cols-7 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/80 text-center text-[11px] font-semibold text-slate-500 dark:text-slate-400 py-2.5">
            {weekDayLabels.map((day, idx) => (
              <div key={idx} className={idx >= 5 ? 'text-indigo-600 dark:text-indigo-400' : ''}>{day}</div>
            ))}
          </div>

          <div className="grid grid-cols-7 auto-rows-fr gap-[1px] bg-slate-200 dark:bg-slate-800/50 min-h-[500px] sm:min-h-[600px]">
            {calendarDays.map((dayObj, index) => {
              const dayEvents = events.filter(e => normalizeDateStr(e.date) === dayObj.dateKey);
              const isToday = dayObj.dateKey === todayKey;

              return (
                <div
                  key={index}
                  onClick={() => onSelectDate(dayObj.date)}
                  className={`min-h-[90px] sm:min-h-[110px] p-1.5 sm:p-2 bg-white dark:bg-slate-900/90 transition-all group hover:bg-indigo-50/50 dark:hover:bg-slate-800/50 flex flex-col justify-between cursor-pointer ${
                    !dayObj.isCurrentMonth ? 'opacity-40 bg-slate-50 dark:bg-slate-950/40' : ''
                  }`}
                >
                  <div className="flex items-center justify-between mb-1">
                    <span className={`text-xs font-bold w-5 h-5 sm:w-6 sm:h-6 rounded-full flex items-center justify-center transition-all ${
                      isToday ? 'bg-indigo-600 text-white shadow ring-2 ring-indigo-400' : 'text-slate-700 dark:text-slate-300'
                    }`}>
                      {dayObj.date.getDate()}
                    </span>

                    <button
                      onClick={(e) => { e.stopPropagation(); onAddEventOnDate(dayObj.dateKey); }}
                      className="opacity-0 group-hover:opacity-100 p-1 rounded bg-slate-200 dark:bg-slate-800 hover:bg-indigo-600 text-slate-700 dark:text-slate-300 hover:text-white transition-all"
                      title="Novo compromisso"
                    >
                      <IconPlus />
                    </button>
                  </div>

                  <div className="space-y-1 flex-1 overflow-y-auto max-h-[80px] custom-scrollbar">
                    {dayEvents.map((evt) => {
                      const meta = getCategoryMeta(evt.category);
                      return (
                        <div
                          key={evt.id}
                          onClick={(e) => onEditEvent(evt, e)}
                          className={`p-1.5 rounded-lg text-[10px] sm:text-[11px] border font-medium transition-all shadow-xs flex flex-col gap-0.5 ${meta.bg} ${meta.text} ${meta.border}`}
                          title={`${evt.title}${evt.location ? ` - Local: ${evt.location}` : ''}`}
                        >
                          <div className="flex items-center justify-between gap-1 truncate font-semibold">
                            <span className="truncate">{evt.title}</span>
                            <span className="text-[9px] font-mono shrink-0 hidden sm:inline">{normalizeTimeStr(evt.startTime)}</span>
                          </div>
                          {evt.location && (
                            <div className="text-[9px] opacity-90 truncate flex items-center gap-0.5 font-sans font-normal">
                              <IconMapPin />
                              <span className="truncate">{evt.location}</span>
                            </div>

                    })}

                </div>

            })}
          </div>

    // --- VISTA DA SEMANA ---
    function WeekView({ currentDate, events, getCategoryMeta, onAddEvent, onEditEvent }) {
      const hours = Array.from({ length: 16 }, (_, i) => i + 7); // 07:00 a 22:00

      const weekDays = useMemo(() => {
        const dayOfWeek = (currentDate.getDay() + 6) % 7;
        const startOfWeek = new Date(currentDate);
        startOfWeek.setDate(currentDate.getDate() - dayOfWeek);

        return Array.from({ length: 7 }, (_, i) => {
          const d = new Date(startOfWeek);
          d.setDate(startOfWeek.getDate() + i);
          return {
            date: d,
            dateKey: formatDateKey(d),
            label: d.toLocaleDateString('pt-PT', { weekday: 'short' }),
            dayNum: d.getDate(),
            isToday: formatDateKey(d) === formatDateKey(new Date())
          };
        });
      }, [currentDate]);

      return (
        <div className="print-area bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm dark:shadow-xl flex flex-col overflow-x-auto">

                  {wd.dayNum}
                </span>
              </div>
            ))}
          </div>

          <div className="divide-y divide-slate-200 dark:divide-slate-800/50 min-w-[650px]">
            {hours.map((hour) => {
              const hourStr = `${String(hour).padStart(2, '0')}:00`;

              return (
                <div key={hour} className="grid grid-cols-8 min-h-[64px]">
                  <div className="p-1 border-r border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 text-[11px] font-mono font-medium text-center flex items-center justify-center bg-slate-50/50 dark:bg-slate-900/40">
                    {hourStr}
                  </div>

                  {weekDays.map((wd, dayIdx) => {
                    const hourEvents = events.filter(e => {
                      if (normalizeDateStr(e.date) !== wd.dateKey) return false;
                      const startH = parseHourNumber(e.startTime);
                      return startH === hour;
                    });

                    return (
                      <div
                        key={dayIdx}
                        onClick={() => onAddEvent(wd.dateKey, hourStr)}
                        className="p-1 border-r border-slate-200/60 dark:border-slate-800/40 last:border-r-0 hover:bg-indigo-50/50 dark:hover:bg-indigo-950/20 transition-all cursor-pointer relative"
                      >
                        {hourEvents.map(evt => {
                          const meta = getCategoryMeta(evt.category);
                          return (
                            <div

                              onClick={(e) => onEditEvent(evt, e)}
                              className={`p-1.5 rounded-lg border text-xs font-medium ${meta.bg} ${meta.text} ${meta.border} shadow-sm mb-1 transition-all hover:scale-[1.01]`}

                              <div className="font-semibold truncate text-[11px]">{evt.title}</div>
                              <div className="text-[10px] opacity-90 flex items-center gap-1 font-mono mt-0.5">
                                <IconClock />
                                <span>{normalizeTimeStr(evt.startTime)} - {normalizeTimeStr(evt.endTime)}</span>
                              </div>
                              {evt.location && (
                                <div className="text-[10px] opacity-85 truncate flex items-center gap-1 mt-0.5 font-sans">

                                  <span className="truncate">{evt.location}</span>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // --- MODAL DE CONFIGURAÇÃO DO GOOGLE SHEETS ---
    function GoogleSheetsSyncModal({ isOpen, onClose, sheetUrl, setSheetUrl, onSync, isSyncing, syncStatus }) {
      const appsScriptCode = `function doGet(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheetEvents = ss.getSheetByName("Eventos") || ss.getSheets()[0];
  var sheetCats = ss.getSheetByName("Categorias");
  
  var events = [];
  if (sheetEvents) {
    var data = sheetEvents.getDataRange().getDisplayValues();
    for (var i = 1; i < data.length; i++) {
      if (data[i][0]) {
        events.push({
          id: String(data[i][0]),
          title: String(data[i][1]),
          date: String(data[i][2]),
          startTime: String(data[i][3]),
          endTime: String(data[i][4]),
          location: String(data[i][5]),
          category: String(data[i][6]),
          notes: String(data[i][7])
        });
      }
    }
  }
  
  var categories = [];
  if (sheetCats) {
    var catData = sheetCats.getDataRange().getDisplayValues();
    for (var j = 1; j < catData.length; j++) {
      if (catData[j][0]) {
        categories.push({
          id: String(catData[j][0]),
          label: String(catData[j][1]),
          color: String(catData[j][2])
        });
      }
    }
  }
  
  return ContentService.createTextOutput(JSON.stringify({ status: "success", events: events, categories: categories }))
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  try {
    var contents = JSON.parse(e.postData.contents);
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    
    var sheetEvents = ss.getSheetByName("Eventos");
    if (!sheetEvents) {
      sheetEvents = ss.getSheets()[0];
      sheetEvents.setName("Eventos");
    }
    sheetEvents.clear();
    sheetEvents.appendRow(["ID", "Título", "Data", "Hora Início", "Hora Término", "Local", "Categoria", "Notas"]);
    
    if (contents.events && contents.events.length > 0) {
      contents.events.forEach(function(evt) {
        sheetEvents.appendRow([
          evt.id, evt.title, evt.date, evt.startTime, evt.endTime, evt.location || "", evt.category, evt.notes || ""
        ]);
      });
    }
    
    if (contents.categories && contents.categories.length > 0) {
      var sheetCats = ss.getSheetByName("Categorias");
      if (!sheetCats) {
        sheetCats = ss.insertSheet("Categorias");
      }
      sheetCats.clear();
      sheetCats.appendRow(["ID", "Nome da Categoria", "Cor"]);
      contents.categories.forEach(function(cat) {
        sheetCats.appendRow([cat.id, cat.label, cat.color || 'indigo']);
      });
    }
    
    return ContentService.createTextOutput(JSON.stringify({ status: "success", message: "Folha de cálculo atualizada!" }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: "error", message: err.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}`;

      return (

            <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">

            <div className="text-xs text-slate-600 dark:text-slate-300 space-y-2 bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl border border-amber-500/30">
              <p className="font-semibold text-amber-600 dark:text-amber-400">ATENÇÃO: Código Apps Script Atualizado!</p>
              <p className="text-[11px]">Se copiou o código anteriormente, por favor <strong>copie este novo código</strong> para o Apps Script e crie uma <strong>Nova Implantação</strong>. Esta nova versão garante que as horas e locais aparecem perfeitamente nas vistas de semana e dia!</p>
            </div>

            <div>
              <div className="flex items-center justify-between mb-1">
                <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider">
                  Código Google Apps Script
                </label>
                <button
                  onClick={() => navigator.clipboard.writeText(appsScriptCode)}

              <textarea

              />

            <div>

              />

            <div className="flex justify-end gap-2 pt-2">

              <button onClick={onSync} disabled={isSyncing} className="px-4 py-2 text-xs font-semibold rounded-xl bg-emerald-600 text-white hover:bg-emerald-500 flex items-center gap-1">

    }

    // RENDERIZAR NA DOM
    const rootElement = document.getElementById('root');
